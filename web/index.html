<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbfaf7">
  <title>Turin by Lime</title>
  <meta name="description" content="Three Lime rides between my hotel and Utopian Hours in Turin, through the eyes of someone used to cycling in Amsterdam.">
  <meta property="og:title" content="Turin by Lime">
  <meta property="og:description" content="Three Lime rides between my hotel and Utopian Hours in Turin, through the eyes of someone used to cycling in Amsterdam.">
  <meta property="og:image" content="photos/dora-junction-green.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%238fd400%22/></svg>">
  <!-- pinned UMD builds: no ES modules, so the page also opens from file:// -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/deck.gl@9.4.0/dist.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Map of the rides"></div>

  <div id="hud">
    <span id="clock" hidden></span>
    <button id="play" type="button" aria-label="Play the story">▶</button>
  </div>

  <section id="card" aria-live="polite">
    <div class="progress"><span id="bar"></span></div>
    <div id="content"></div>
    <nav>
      <button id="prev" type="button" aria-label="Previous">←</button>
      <span id="count"></span>
      <button id="next" type="button">Next →</button>
    </nav>
  </section>

  <script src="data/story.js"></script>
  <script src="data/text.js"></script>
  <script src="app.js"></script>
</body>
</html>
